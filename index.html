<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core System Alpha</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#030712;
--card-bg:rgba(17,24,39,0.8);
--accent:#3b82f6;
--accent-glow:rgba(59,130,246,0.3);
--text-main:#f9fafb;
--text-dim:#9ca3af;
--border:rgba(255,255,255,0.08);
--input-focus:rgba(59,130,246,0.15);
}

body{
margin:0;
font-family:'Plus Jakarta Sans',sans-serif;
background-color:var(--bg);
background-image:
radial-gradient(at 0% 0%,rgba(59,130,246,0.15) 0px,transparent 50%),
radial-gradient(at 100% 100%,rgba(37,99,235,0.1) 0px,transparent 50%);
color:var(--text-main);
min-height:100vh;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:480px;
padding:40px 20px;
}

header{text-align:center;margin-bottom:50px;}
header h1{
font-size:28px;
font-weight:800;
margin:0;
background:linear-gradient(135deg,#fff 0%,#93c5fd 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
header p{color:var(--text-dim);font-size:14px;margin-top:8px;}

#navScreen{display:grid;gap:16px;}

.nav-card{
background:var(--card-bg);
border:1px solid var(--border);
padding:24px;
border-radius:20px;
cursor:pointer;
transition:.4s;
backdrop-filter:blur(16px);
display:flex;
align-items:center;
gap:20px;
}
.nav-card:hover{
border-color:var(--accent);
transform:scale(1.02);
}
.icon-box{
width:56px;height:56px;
background:rgba(59,130,246,.1);
border-radius:14px;
display:flex;align-items:center;justify-content:center;
font-size:24px;color:var(--accent);
}
.content b{display:block;font-size:18px;}
.content span{font-size:13px;color:var(--text-dim);}

.form-section{display:none;}

.card{
background:var(--card-bg);
padding:32px;
border-radius:24px;
border:1px solid var(--border);
}

.back-btn{
background:none;border:none;
color:var(--text-dim);
font-size:13px;
cursor:pointer;
margin-bottom:20px;
}

input,textarea{
width:100%;
background:rgba(0,0,0,.3);
border:1px solid var(--border);
padding:14px 16px;
margin:8px 0 16px;
border-radius:12px;
color:white;
box-sizing:border-box;
}

input:focus,textarea:focus{
outline:none;
border-color:var(--accent);
background:var(--input-focus);
box-shadow:0 0 0 4px var(--accent-glow);
}

.check-strip{
display:flex;
align-items:center;
gap:12px;
margin-bottom:8px;
padding:14px;
background:rgba(255,255,255,.03);
border-radius:12px;
}

.check-strip input{
width:20px;height:20px;
accent-color:var(--accent);
}

.submit-btn{
width:100%;
padding:18px;
background:var(--accent);
color:white;
border:none;
border-radius:14px;
font-weight:700;
font-size:16px;
cursor:pointer;
margin-top:24px;
}

#statusModal{
position:fixed;
inset:0;
background:rgba(3,7,18,.9);
display:none;
justify-content:center;
align-items:center;
z-index:2000;
}

.spinner{
width:50px;height:50px;
border:3px solid rgba(255,255,255,.1);
border-top-color:var(--accent);
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<body>

<div class="container">

<header>
<h1>CORE SYSTEM</h1>
<p>Operational Reporting Interface</p>
</header>

<div id="navScreen">
<div class="nav-card" onclick="openSection('checkin')">
<div class="icon-box">⚡</div>
<div class="content">
<b>System Check-In</b>
<span>Initialize workspace</span>
</div>
</div>

<div class="nav-card" onclick="openSection('checkout')">
<div class="icon-box">🛡️</div>
<div class="content">
<b>System Check-Out</b>
<span>Secure station</span>
</div>
</div>
</div>

<!-- CHECK IN -->
<div id="checkinForm" class="form-section">
<button class="back-btn" onclick="goHome()">← Back</button>
<div class="card">
<form id="ci_form">

<input id="ci_name" placeholder="Full Name" required>
<input id="ci_table" placeholder="Table Name" required>
<input id="ci_work" placeholder="Work Plan" required>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
<input type="date" id="ci_date" required>
<input type="time" id="ci_time" required>
</div>

<div class="check-strip"><input type="checkbox" id="ci_clean"> Table Cleaned</div>
<div class="check-strip"><input type="checkbox" id="ci_cctv"> CCTV Working</div>
<div class="check-strip"><input type="checkbox" id="ci_waste"> Waste Basket Available</div>
<div class="check-strip"><input type="checkbox" id="ci_internet"> Internet Perfect</div>

<button class="submit-btn">EXECUTE CHECK-IN</button>
</form>
</div>
</div>

<!-- CHECK OUT -->
<div id="checkoutForm" class="form-section">
<button class="back-btn" onclick="goHome()">← Back</button>
<div class="card">
<form id="co_form">

<input id="co_name" placeholder="Name" required>
<input id="co_table" placeholder="Table Name" required>
<input id="co_work" placeholder="Work Summary" required>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
<input type="date" id="co_date" required>
<input type="time" id="co_time" required>
</div>

<textarea id="co_done" placeholder="Work Completed" required></textarea>
<textarea id="co_day" placeholder="How was your day?" required></textarea>

<div class="check-strip"><input type="checkbox" id="co_clean"> Table Cleaned</div>
<div class="check-strip"><input type="checkbox" id="co_floor"> Floor Clean</div>
<div class="check-strip"><input type="checkbox" id="co_tools"> Tools Returned</div>
<div class="check-strip"><input type="checkbox" id="co_cable"> Cables Safe</div>

<button class="submit-btn">TERMINATE SESSION</button>
</form>
</div>
</div>

</div>

<div id="statusModal">
<div>
<div class="spinner"></div>
<p style="text-align:center;margin-top:20px;">Uploading...</p>
</div>
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbxBGajs2FUr2Nt-swwRW5jK4J_-WSZWtRu1VSgHm8HSPXXwJIy6NRxGEwSdfzX9M_ruYA/exec";

function openSection(id){
document.getElementById('navScreen').style.display='none';
document.getElementById(id+'Form').style.display='block';
}

function goHome(){
document.querySelectorAll('.form-section').forEach(f=>f.style.display='none');
document.getElementById('navScreen').style.display='grid';
}

async function handleSubmission(e,type){
e.preventDefault();

document.getElementById("statusModal").style.display="flex";

const p=type==="checkin"?"ci":"co";

const data={
type:type,
name:document.getElementById(p+"_name").value,
table:document.getElementById(p+"_table").value,
work:document.getElementById(p+"_work").value,
date:document.getElementById(p+"_date").value,
time:document.getElementById(p+"_time").value,

cleaned:document.getElementById(p+"_clean")?.checked?"Yes":"No",
cctv:document.getElementById("ci_cctv")?.checked?"Yes":"No",
waste:document.getElementById("ci_waste")?.checked?"Yes":"No",
internet:document.getElementById("ci_internet")?.checked?"Yes":"No",

done:document.getElementById("co_done")?.value||"",
day:document.getElementById("co_day")?.value||"",
floor:document.getElementById("co_floor")?.checked?"Yes":"No",
tools:document.getElementById("co_tools")?.checked?"Yes":"No",
cable:document.getElementById("co_cable")?.checked?"Yes":"No"
};

await fetch(API,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

setTimeout(()=>{
document.getElementById("statusModal").style.display="none";
e.target.reset();
goHome();
},2000);
}

document.getElementById("ci_form").onsubmit=e=>handleSubmission(e,"checkin");
document.getElementById("co_form").onsubmit=e=>handleSubmission(e,"checkout");

</script>

</body>
</html>
