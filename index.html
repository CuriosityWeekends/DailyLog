<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check In / Check Out System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fc;
  color:#1f2937;
}

.container{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

/* ===== CARD ===== */

.card{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
  margin-bottom:30px;
}

.card h2{
  margin:0 0 8px;
}

.subtitle{
  color:#6b7280;
  font-size:14px;
  margin-bottom:15px;
}

/* ===== FORM ===== */

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #cbd5e1;
  border-radius:6px;
  font-size:14px;
}

input:focus{
  border-color:#2563eb;
  outline:none;
}

/* ===== CHECKBOX ===== */

.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0;
}

.check-row input{
  width:18px;
  height:18px;
  cursor:pointer;
}

.check-row label{
  font-size:14px;
  cursor:pointer;
}

/* ===== BUTTON ===== */

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

button:hover{
  background:#1e40af;
}

/* ===== MODAL ===== */

#submitModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-card{
  background:white;
  width:260px;
  padding:25px;
  border-radius:12px;
  text-align:center;
  animation:pop .3s ease;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* LOADER */

.spinner{
  width:50px;
  height:50px;
  border:5px solid #e5e7eb;
  border-top:5px solid #2563eb;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* SUCCESS */

#successBox{
  display:none;
}

.checkmark{
  width:60px;
  height:60px;
  background:#22c55e;
  color:white;
  font-size:36px;
  border-radius:50%;
  line-height:60px;
  margin:0 auto 10px;
  animation:check .4s ease;
}

@keyframes check{
  from{transform:scale(0)}
  to{transform:scale(1)}
}

</style>
</head>

<body>

<div class="container">

<h1>📋 Daily Report System</h1>


<!-- ===== CHECK IN ===== -->

<div class="card">

<h2>✅ Check In</h2>
<div class="subtitle">Before starting work</div>

<form id="checkinForm">

<input id="ci_name" placeholder="Name" required>
<input id="ci_table" placeholder="Table Name" required>
<input id="ci_work" placeholder="Work Details" required>

<input type="date" id="ci_date" required>
<input type="time" id="ci_time" required>

<div class="check-row">
<input type="checkbox" id="ci_clean">
<label for="ci_clean">Is table cleaned?</label>
</div>

<div class="check-row">
<input type="checkbox" id="ci_cctv">
<label for="ci_cctv">Is CCTV working?</label>
</div>

<div class="check-row">
<input type="checkbox" id="ci_waste">
<label for="ci_waste">Waste basket available?</label>
</div>

<div class="check-row">
<input type="checkbox" id="ci_internet">
<label for="ci_internet">Internet connection perfect?</label>
</div>

<button type="submit">Submit Check In</button>

</form>
</div>


<!-- ===== CHECK OUT ===== -->

<div class="card">

<h2>🚪 Check Out</h2>
<div class="subtitle">Before leaving</div>

<form id="checkoutForm">

<input id="co_name" placeholder="Name" required>
<input id="co_table" placeholder="Table Name" required>
<input id="co_work" placeholder="Work Details" required>

<input type="date" id="co_date" required>
<input type="time" id="co_time" required>

<div class="check-row">
<input type="checkbox" id="co_clean">
<label for="co_clean">Is table cleaned?</label>
</div>

<div class="check-row">
<input type="checkbox" id="co_cctv">
<label for="co_cctv">Is CCTV working?</label>
</div>

<div class="check-row">
<input type="checkbox" id="co_waste">
<label for="co_waste">Waste basket available?</label>
</div>

<div class="check-row">
<input type="checkbox" id="co_internet">
<label for="co_internet">Internet connection perfect?</label>
</div>

<button type="submit">Submit Check Out</button>

</form>
</div>

</div>


<!-- ===== MODAL ===== -->

<div id="submitModal">

<div class="modal-card">

<div id="loaderBox">
  <div class="spinner"></div>
  <p>Submitting...</p>
</div>

<div id="successBox">
  <div class="checkmark">✓</div>
  <p>Submitted Successfully</p>
</div>

</div>
</div>


<script>

// 🔗 YOUR SCRIPT URL
const API = "https://script.google.com/macros/s/AKfycbxBGajs2FUr2Nt-swwRW5jK4J_-WSZWtRu1VSgHm8HSPXXwJIy6NRxGEwSdfzX9M_ruYA/exec";


// ===== MODAL =====

const modal = document.getElementById("submitModal");
const loader = document.getElementById("loaderBox");
const success = document.getElementById("successBox");

function openModal(){
  modal.style.display="flex";
  loader.style.display="block";
  success.style.display="none";
}

function showSuccess(){
  loader.style.display="none";
  success.style.display="block";
}

function closeModal(){
  modal.style.display="none";
}


// ===== SEND DATA =====

function send(form,type){

  let p = type=="checkin" ? "ci" : "co";

  let data = {

    type:type,

    name:document.getElementById(p+"_name").value,
    table:document.getElementById(p+"_table").value,
    work:document.getElementById(p+"_work").value,

    date:document.getElementById(p+"_date").value,
    time:document.getElementById(p+"_time").value,

    cleaned:document.getElementById(p+"_clean").checked?"Yes":"No",
    cctv:document.getElementById(p+"_cctv").checked?"Yes":"No",
    waste:document.getElementById(p+"_waste").checked?"Yes":"No",
    internet:document.getElementById(p+"_internet").checked?"Yes":"No"

  };

  openModal();

  fetch(API,{
    method:"POST",
    body:JSON.stringify(data)
  })
  .then(r=>r.text())
  .then(()=>{

    showSuccess();

    setTimeout(()=>{
      closeModal();
      form.reset();
    },1500);

  })
  .catch(()=>{

    closeModal();
    alert("Submission Failed ❌");

  });

}


// ===== FORM EVENTS =====

document.getElementById("checkinForm").addEventListener("submit",e=>{
  e.preventDefault();
  send(e.target,"checkin");
});

document.getElementById("checkoutForm").addEventListener("submit",e=>{
  e.preventDefault();
  send(e.target,"checkout");
});

</script>

</body>
</html>
