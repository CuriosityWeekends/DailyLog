<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fc;
  color:#1f2937;
}

.hidden{display:none;}

.container{
  max-width:1300px;
  margin:auto;
  padding:20px;
}


/* ===== LOGIN ===== */

.login-box{
  max-width:400px;
  margin:120px auto;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.1);
  text-align:center;
}

.login-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #cbd5e1;
  border-radius:6px;
}

.login-box button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

#error{color:red;display:none;}


/* ===== HEADER ===== */

.header{
  background:white;
  padding:15px 20px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
  margin-bottom:20px;
}

.header button{
  background:#ef4444;
  color:white;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
}


/* ===== FILTER ===== */

.filter-box{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.06);
  margin-bottom:20px;

  display:flex;
  gap:15px;
  flex-wrap:wrap;
  align-items:center;
}

.filter-box input{
  padding:8px;
  border:1px solid #cbd5e1;
  border-radius:6px;
}

.filter-box button{
  padding:8px 14px;
  background:#22c55e;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.filter-box button:hover{
  background:#16a34a;
}


/* ===== TABLE ===== */

.table-box{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
}

th{
  background:#f1f5f9;
  position:sticky;
  top:0;
}

</style>
</head>

<body>


<!-- ========== LOGIN ========== -->

<div id="loginPage" class="login-box">

<h2>🔐 Admin Login</h2>

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error">Wrong password ❌</p>

</div>


<!-- ========== DASHBOARD ========== -->

<div id="dashboard" class="hidden">

<div class="container">


<!-- HEADER -->

<div class="header">

<h2>📊 Report Admin Panel</h2>

<button onclick="logout()">Logout</button>

</div>


<!-- FILTER -->

<div class="filter-box">

<label>From:</label>
<input type="date" id="fromDate">

<label>To:</label>
<input type="date" id="toDate">

<button onclick="applyFilter()">Filter</button>

<button onclick="downloadMD()">⬇ Download Summary (.md)</button>

</div>


<!-- TABLE -->

<div class="table-box">

<table id="dataTable">

<thead>
<tr>
<th>Type</th>
<th>Name</th>
<th>Table</th>
<th>Work</th>
<th>Date</th>
<th>Time</th>
<th>Clean</th>
<th>CCTV</th>
<th>Waste</th>
<th>Net</th>
<th>Work Done</th>
<th>Day Feedback</th>
<th>Floor</th>
<th>Cable</th>
<th>Tools</th>
<th>Timestamp</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


</div>
</div>


<script>

/* ===== CONFIG ===== */

const PASSWORD = "report0816";

const SHEET_ID =
"1_7g_XuKW0TnjV2no4it9lrljoViP-ID1YlsQvsKQs2M";


let allData = [];


// ===== LOGIN =====

function login(){

  if(document.getElementById("password").value===PASSWORD){

    localStorage.setItem("admin","true");

    showDashboard();

  }else{

    document.getElementById("error").style.display="block";

  }
}


function logout(){

  localStorage.removeItem("admin");
  location.reload();

}



// ===== SHOW DASHBOARD =====

function showDashboard(){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("dashboard").classList.remove("hidden");

  loadData();

}



// ===== GOOGLE DATE =====

function parseGoogleDate(val){

  if(!val || !val.startsWith("Date(")) return null;

  let n = val.match(/\d+/g).map(Number);

  return new Date(n[0],n[1],n[2],n[3]||0,n[4]||0,n[5]||0);
}



function formatDate(val){

  let d = parseGoogleDate(val);
  if(!d) return "";

  return d.toLocaleDateString();
}


function formatTime(val){

  let d = parseGoogleDate(val);
  if(!d) return "";

  return d.toLocaleTimeString([],{
    hour:'2-digit',
    minute:'2-digit'
  });
}



// ===== LOAD DATA =====

function loadData(){

  let url =
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  fetch(url)
  .then(r=>r.text())
  .then(text=>{

    let json = JSON.parse(
      text.replace("/*O_o*/","")
          .replace("google.visualization.Query.setResponse(","")
          .slice(0,-2)
    );

    let cols = json.table.cols.map(c=>c.label.toLowerCase());

    let rows = json.table.rows.map(r=>r.c.map(x=>x?x.v:""));

    allData = rows.map(r=>{
      let o={};
      cols.forEach((k,i)=>o[k]=r[i]);
      return o;
    });

    fillTable(allData);

  });

}



// ===== TABLE =====

function fillTable(data){

  let body =
    document.querySelector("#dataTable tbody");

  body.innerHTML="";

  data.forEach(r=>{

    let tr = document.createElement("tr");

    tr.innerHTML=`
      <td>${r.type||""}</td>
      <td>${r.name||""}</td>
      <td>${r.table||""}</td>
      <td>${r.work||""}</td>

      <td>${formatDate(r.date)}</td>
      <td>${formatTime(r.time)}</td>

      <td>${r.cleaned||""}</td>
      <td>${r.cctv||""}</td>
      <td>${r.waste||""}</td>
      <td>${r.internet||""}</td>

      <td>${r.workdone||""}</td>
      <td>${r.dayfeedback||""}</td>

      <td>${r.floorclean||""}</td>
      <td>${r.cablesafe||""}</td>
      <td>${r.toolsreturned||""}</td>

      <td>${formatDate(r.timestamp)} ${formatTime(r.timestamp)}</td>
    `;

    body.appendChild(tr);

  });

}



// ===== FILTER =====

function applyFilter(){

  let f = document.getElementById("fromDate").value;
  let t = document.getElementById("toDate").value;

  if(!f || !t){
    fillTable(allData);
    return;
  }

  let from = new Date(f);
  let to = new Date(t);

  to.setHours(23,59,59);

  let filtered = allData.filter(r=>{

    let d = parseGoogleDate(r.date);

    if(!d) return false;

    return d>=from && d<=to;

  });

  fillTable(filtered);

}



// ===== DOWNLOAD MARKDOWN =====

function downloadMD(){

  let f = document.getElementById("fromDate").value;
  let t = document.getElementById("toDate").value;

  let data = allData;

  if(f && t){

    let from = new Date(f);
    let to = new Date(t);
    to.setHours(23,59,59);

    data = allData.filter(r=>{
      let d = parseGoogleDate(r.date);
      return d && d>=from && d<=to;
    });
  }


  if(data.length===0){
    alert("No data found");
    return;
  }


  let checkin = data.filter(r=>r.type==="checkin").length;
  let checkout = data.filter(r=>r.type==="checkout").length;


  let md = `# 📊 Curiosity Weekends Report

## 📅 Period
From: ${f||"All"}
To: ${t||"All"}

---

## 📈 Summary

- Total Reports: ${data.length}
- Check Ins: ${checkin}
- Check Outs: ${checkout}

---

## 📋 Details

`;


  data.forEach((r,i)=>{

    md += `
### ${i+1}. ${r.name} (${r.type.toUpperCase()})

- Table: ${r.table}
- Work: ${r.work}
- Date: ${formatDate(r.date)}
- Time: ${formatTime(r.time)}

- Cleaned: ${r.cleaned}
- CCTV: ${r.cctv}
- Waste: ${r.waste}
- Internet: ${r.internet}

- Work Done: ${r.workdone}
- Day Feedback: ${r.dayfeedback}

- Floor: ${r.floorclean}
- Cable: ${r.cablesafe}
- Tools: ${r.toolsreturned}

---

`;
  });


  let blob = new Blob([md],{type:"text/markdown"});

  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download =
    `report_${f||"all"}_to_${t||"all"}.md`;

  a.click();

}



// ===== AUTO LOGIN =====

if(localStorage.getItem("admin")==="true"){
  showDashboard();
}

</script>

</body>
</html>
