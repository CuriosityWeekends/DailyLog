<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fc;
  color:#1f2937;
}

.hidden{display:none;}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* ===== LOGIN ===== */

.login-box{
  max-width:400px;
  margin:120px auto;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
  text-align:center;
}

.login-box h2{
  margin-bottom:10px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin:12px 0;
  border:1px solid #cbd5e1;
  border-radius:6px;
}

.login-box button{
  width:100%;
  padding:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
}

.login-box button:hover{
  background:#1e40af;
}

#error{
  color:red;
  display:none;
}


/* ===== LOADING ===== */

#loadingScreen{
  position:fixed;
  inset:0;
  background:#020617;
  color:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

.loader-circle{
  width:80px;
  height:80px;
  border:6px solid #334155;
  border-top:6px solid #38bdf8;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#percent{
  font-size:24px;
  font-weight:700;
}


/* ===== HEADER ===== */

.header{
  background:white;
  padding:15px 20px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.06);
  margin-bottom:20px;
}

.header h2{margin:0;}

.header button{
  padding:8px 14px;
  background:#ef4444;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.header button:hover{
  background:#dc2626;
}


/* ===== DASHBOARD ===== */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.stat-card h3{
  margin:0;
  font-size:14px;
  color:#6b7280;
}

.stat-card p{
  margin:5px 0 0;
  font-size:26px;
  font-weight:700;
}


/* ===== TABLE ===== */

.table-box{
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.08);
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f1f5f9;
  position:sticky;
  top:0;
}

</style>
</head>

<body>


<!-- ===== LOGIN ===== -->

<div id="loginPage" class="login-box">

<h2>🔐 Admin Login</h2>
<p>Enter password</p>

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error">Wrong Password ❌</p>

</div>


<!-- ===== LOADING ===== -->

<div id="loadingScreen">

<div class="loader-circle"></div>

<p>Please wait, loading data...</p>

<p id="percent">0%</p>

</div>


<!-- ===== DASHBOARD ===== -->

<div id="dashboard" class="hidden">

<div class="container">


<!-- HEADER -->

<div class="header">

<h2>📊 Report Dashboard</h2>

<button onclick="logout()">Logout</button>

</div>


<!-- STATS -->

<div class="cards">

<div class="stat-card">
<h3>Total Reports</h3>
<p id="total">--</p>
</div>

<div class="stat-card">
<h3>Check In</h3>
<p id="checkin">--</p>
</div>

<div class="stat-card">
<h3>Check Out</h3>
<p id="checkout">--</p>
</div>

<div class="stat-card">
<h3>Today</h3>
<p id="today">--</p>
</div>

</div>


<!-- TABLE -->

<div class="table-box">

<h3>📄 All Reports</h3>

<table id="reportTable">

<thead>
<tr>
<th>Type</th>
<th>Name</th>
<th>Table</th>
<th>Work</th>
<th>Date</th>
<th>Time</th>
<th>Clean</th>
<th>CCTV</th>
<th>Waste</th>
<th>Net</th>
<th>Timestamp</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>


</div>
</div>


<script>

/* ===== CONFIG ===== */

const API = "https://script.google.com/macros/s/AKfycbxBGajs2FUr2Nt-swwRW5jK4J_-WSZWtRu1VSgHm8HSPXXwJIy6NRxGEwSdfzX9M_ruYA/exec";

const PASSWORD = "report0816"; // Change if needed


/* ===== LOGIN ===== */

function login(){

  let pass = document.getElementById("password").value;

  if(pass === PASSWORD){

    localStorage.setItem("admin","true");

    startLoading();

  }else{

    document.getElementById("error").style.display="block";

  }
}


function logout(){

  localStorage.removeItem("admin");
  location.reload();

}


/* ===== LOADING ===== */

function startLoading(){

  document.getElementById("loginPage").style.display="none";
  document.getElementById("loadingScreen").style.display="flex";

  let p = 0;

  let timer = setInterval(()=>{

    p++;

    document.getElementById("percent").innerText = p + "%";

    if(p>=100){

      clearInterval(timer);

      document.getElementById("loadingScreen").style.display="none";

      loadDashboard();

    }

  },20);

}


/* ===== DASHBOARD ===== */

function loadDashboard(){

  document.getElementById("dashboard").classList.remove("hidden");

  fetch(API+"?action=read")
  .then(r=>r.json())
  .then(data=>{

    fillTable(data);
    fillStats(data);

  })
  .catch(()=>{
    alert("Failed to load data");
  });

}


/* ===== TABLE ===== */

function fillTable(data){

  let body = document.querySelector("#reportTable tbody");

  body.innerHTML = "";

  data.forEach(row=>{

    let tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.type}</td>
      <td>${row.name}</td>
      <td>${row.table}</td>
      <td>${row.work}</td>
      <td>${row.date}</td>
      <td>${row.time}</td>
      <td>${row.cleaned}</td>
      <td>${row.cctv}</td>
      <td>${row.waste}</td>
      <td>${row.internet}</td>
      <td>${row.timestamp}</td>
    `;

    body.appendChild(tr);

  });

}


/* ===== STATS ===== */

function fillStats(data){

  let total = data.length;

  let cin = data.filter(r=>r.type=="checkin").length;

  let cout = data.filter(r=>r.type=="checkout").length;

  let today = new Date().toISOString().slice(0,10);

  let todayCount = data.filter(r=>r.date==today).length;


  document.getElementById("total").innerText = total;
  document.getElementById("checkin").innerText = cin;
  document.getElementById("checkout").innerText = cout;
  document.getElementById("today").innerText = todayCount;

}


/* ===== AUTO LOGIN ===== */

if(localStorage.getItem("admin")==="true"){
  startLoading();
}

</script>

</body>
</html>
